<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Industry Readiness{% endblock %}</title>
  <meta name="description" content="Upload your CV and get an Industry Readiness Score with personalised recommendations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="nav">
    <a class="brand" href="{{ url_for('index') }}"><span class="logo">IR</span> Industry Readiness</a>
    <nav>
      <a href="{{ url_for('index') }}">Analyse CV</a>
      <a href="{{ url_for('methodology') }}">How scoring works</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="footer">
    <p>{{ DISCLAIMER }}</p>
    <p>Your CV file is never stored. Results are kept for 30 days and you can delete them anytime.</p>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
